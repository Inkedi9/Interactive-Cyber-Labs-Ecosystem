<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="neonArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon box -->
  <rect x="8" y="16" width="88" height="88" rx="22" fill="#0f172a"/>
  <rect x="8" y="16" width="88" height="88" rx="22" stroke="#a855f7" stroke-opacity="0.45" stroke-width="2"/>

  <!-- > -->
  <path
    d="M34 44 L50 60 L34 76"
    stroke="url(#neonArrow)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- _ -->
  <line
    x1="58"
    y1="76"
    x2="72"
    y2="76"
    stroke="#60a5fa"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- scan line -->
  <rect x="20" y="58" width="64" height="1.4" fill="#a855f7" opacity="0.28"/>

  <!-- Main text -->
  <text
    x="122"
    y="58"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="34"
    font-weight="800"
    fill="url(#neonText)"
    filter="url(#glow)"
    letter-spacing="0.5"
  >
    Inkedi
  </text>

  <text
    x="122"
    y="90"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="18"
    font-weight="600"
    fill="#94a3b8"
    letter-spacing="3"
  >
    CYBER PORTFOLIO
  </text>
</svg>